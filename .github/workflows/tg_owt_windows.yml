name: tg_owt derle (Windows, sesli cagri)

# NVGram'in MASAUSTU surumu icin WebRTC.
#
# Sesli cagrida TDLib yalniz SINYALLESMEYI veriyor; sesi tgcalls
# tasiyor ve tgcalls WebRTC uzerine kurulu. Android tarafinda WebRTC'nin
# kirpilmis kopyasi Telegram'in kendi deposunda hazir geliyor
# (tgcalls.yml). Windows'ta o kopya YOK: masaustu icin dogru kaynak
# desktop-app/tg_owt - Telegram Desktop'in kendi kirpilmis WebRTC'si ve
# duz CMake ile MSVC'de derleniyor.
#
# NEDEN BULUTTA: yaklasik 2500 kaynak dosya. Kullanicinin makinesi 4
# cekirdek ve D: surucusunde yer dar; TDLib'de ogrenilen dersin aynisi.
#
# NE URETIYOR: tg_owt.lib ve yanindaki statik kutuphaneler + basliklar.
# tgcalls'in KENDISI burada derlenmiyor - o yalnizca yuz kadar dosya ve
# NVGram'in kendi CMake'inde derleniyor; boylece hangi parcalarinin
# (yalniz ses) derlenecegine yerelde karar verilebiliyor.

on:
  workflow_dispatch:
    inputs:
      tg_owt_ref:
        description: "tg_owt surumu: bos birakilirsa asagidaki sabit commit"
        required: false
        default: ""

env:
  # COMMIT olarak sabit; TDLib ve tgcalls'ta ogrenilen dersin aynisi.
  # Ustteki depo ilerledikce WebRTC'nin API'si degisiyor ve yerelde
  # yazilan kopru belli bir API'ye gore yaziliyor.
  #
  # 19d51d3c = 2026-07-25, "Build with OpenSSL 4 (ASN1_STRING became opaque)"
  NVGRAM_TG_OWT_COMMIT: 19d51d3c19632a63fdbe17c62f10332d978cb940

  # vcpkg'den gelen bagimliliklar. tg_owt bunlarin yalnizca
  # BASLIKLARINI istiyor (paketlenmemis derlemede link etmiyor, statik
  # kutuphane oldugu icin semboller nihai uygulama linklenirken
  # cozuluyor) - ama .lib dosyalari da ciktiya konuyor cunku NVGram'i
  # linklerken orada lazim olacaklar.
  NVGRAM_VCPKG_PAKETLERI: openssl opus ffmpeg libvpx openh264 libjpeg-turbo

jobs:
  derle:
    name: windows x64
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: tg_owt kaynagini al
        uses: actions/checkout@v4
        with:
          repository: desktop-app/tg_owt
          ref: ${{ github.event.inputs.tg_owt_ref || env.NVGRAM_TG_OWT_COMMIT }}
          path: tg_owt
          submodules: recursive
          fetch-depth: 1

      - name: Derlenen surumu yaz
        shell: bash
        run: |
          echo "commit: $(git -C tg_owt rev-parse HEAD)"
          echo "tarih : $(git -C tg_owt log -1 --format=%ad)"
          echo "konu  : $(git -C tg_owt log -1 --format=%s)"
          echo "--- kaynak sayisi ---"
          find tg_owt/src -name '*.cc' -o -name '*.cpp' -o -name '*.c' | wc -l

      - name: Ninja ve nasm kur
        shell: bash
        run: |
          choco install ninja nasm --no-progress -y
          echo "C:/Program Files/NASM" >> "$GITHUB_PATH"

      # Derleyici onbellegi: is akisi birden fazla kez calisacak
      # (yapilandirma hatalari, eksik bagimliliklar). Onbellek olmadan
      # her seferinde 2500 dosya bastan derleniyor.
      #
      # DUSMESI ISI DURDURMUYOR (continue-on-error). Ilk denemede
      # sccache'in indirilmesi gecici bir ag hatasiyla dustu ve UC
      # SAATLIK is daha basinda iptal oldu. Onbellek bir hizlandirma;
      # derlemenin sarti degil.
      - name: Derleyici onbellegi
        continue-on-error: true
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          variant: sccache
          key: tg-owt-win-${{ github.event.inputs.tg_owt_ref || env.NVGRAM_TG_OWT_COMMIT }}
          max-size: 2G

      # Onbellek kurulamadiysa CMake'e sccache'i VERMEMEK sart: olmayan
      # bir baslatici verilirse derleme ilk dosyada duser.
      - name: Onbellek var mi
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1 ; then
            echo "sccache kullanilacak"
            echo "ONBELLEK_BAYRAKLARI=-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache yok; onbelleksiz derlenecek"
            echo "ONBELLEK_BAYRAKLARI=" >> "$GITHUB_ENV"
          fi

      # Runner'da vcpkg hazir geliyor (VCPKG_INSTALLATION_ROOT).
      # Ikili onbellek acik: ffmpeg'in derlenmesi tek basina yarim saat
      # surebiliyor ve is akisi tekrar calistiginda bosuna beklenmesin.
      - name: Bagimliliklari kur (vcpkg)
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install \
            --triplet x64-windows \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_kurulum" \
            $NVGRAM_VCPKG_PAKETLERI
          echo "--- kurulanlar ---"
          ls "$GITHUB_WORKSPACE/vcpkg_kurulum/x64-windows/include" | head -30

      # ESKI WINDOWS SES AYGITINI KAYNAK LISTESINDEN CIKAR.
      #
      # modules/audio_device/win/audio_device_core_win.cc MSVC ile
      # DERLENMIYOR - yirmiden fazla yerde:
      #
      #   error C2362: initialization of 'volume' is skipped by 'goto Exit'
      #
      # Bu, WebRTC'nin artik bakilmayan ESKI ses aygiti. Chromium onu
      # derlemiyor; agacta duruyor ama kimse dokunmuyor. Modern
      # karsiligi (core_audio_base/input/output/utility_win.cc ve
      # audio_device_module_win.cc) MSVC ile SORUNSUZ derlendi - olculdu,
      # 598-605 arasi hepsi gecti.
      #
      # CIKARMAK GUVENLI: dosyanin sinifina (AudioDeviceWindowsCore) tek
      # atif audio_device_impl.cc'de ve WEBRTC_WINDOWS_CORE_AUDIO_BUILD
      # makrosunun arkasinda; tg_owt o makroyu tanimlamiyor. Yani
      # cozumlenmemis sembol olusmuyor.
      #
      # NVGram ses aygitini zaten modern yoldan kuruyor: tgcalls'in
      # Descriptor'undaki createAudioDeviceModule kancasina
      # webrtc::CreateWindowsCoreAudioAudioDeviceModule veriliyor.
      - name: Eski ses aygitini cikar
        shell: bash
        run: |
          KAYNAK=tg_owt/CMakeLists.txt
          sed -i '/audio_device_core_win/d' "$KAYNAK"

          # Yama tutmazsa DERLEME DUSSUN: sessizce eski haliyle derlemek,
          # ayni hatayi yirmi dakika sonra yeniden gormek demek.
          if grep -q 'audio_device_core_win' "$KAYNAK" ; then
            echo "HATA: eski ses aygiti hala listede"
            exit 1
          fi
          echo "--- cikarildi ---"
          grep -n "audio_device/win/" "$KAYNAK" | head

      # YAPILANDIRMA VE DERLEME TEK ADIMDA, cmd kabugunda.
      #
      # ONCE bash'te ayri adimlarda yapiliyordu ve CMake derleyici olarak
      # MSVC'yi DEGIL, runner'da PATH'te duran MinGW g++'i seciyordu:
      #
      #   rtc_base/platform_thread_types.cc:115: error: '__try' was not
      #   declared in this scope
      #   rtc_base/network.cc:871: error: 'IF_TYPE_WWANPP' was not declared
      #
      # Ikisi de Windows SDK'sinin ve MSVC'nin kendi seyleri; g++ onlari
      # bilmiyor. Ninja jeneratoru derleyiciyi ORTAMDAN aliyor, yani
      # vcvars64 calistirilmadan Ninja kullanmak MinGW'ye dusmek demek.
      # Ortam degiskenleri adimlar arasinda tasinmadigi icin yapilandirma
      # ve derleme ayni kabukta duruyor.
      #
      # TG_OWT_SPECIAL_TARGET bos DEGIL: bos birakilirsa "paketlenmis
      # derleme" kipine giriyor ve bagimliliklari pkg-config ile ariyor -
      # Windows'ta yok. win64 verilince yalnizca baslik yollarini
      # istiyor.
      - name: Yapilandir ve derle (MSVC)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSYOLU=%%i
          call "%VSYOLU%\VC\Auxiliary\Build\vcvars64.bat"
          where cl.exe
          set KURULUM=%GITHUB_WORKSPACE%\vcpkg_kurulum\x64-windows
          cmake -G Ninja -Wno-dev ^
            -S tg_owt -B derleme ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl ^
            %ONBELLEK_BAYRAKLARI% ^
            -DCMAKE_INSTALL_PREFIX=%GITHUB_WORKSPACE%/cikti/tg_owt ^
            -DTG_OWT_SPECIAL_TARGET=win64 ^
            -DTG_OWT_BUILD_AUDIO_BACKENDS=ON ^
            -DTG_OWT_OPENSSL_INCLUDE_PATH=%KURULUM%/include ^
            -DTG_OWT_OPUS_INCLUDE_PATH=%KURULUM%/include/opus ^
            -DTG_OWT_FFMPEG_INCLUDE_PATH=%KURULUM%/include ^
            -DTG_OWT_LIBJPEG_INCLUDE_PATH=%KURULUM%/include ^
            -DTG_OWT_LIBVPX_INCLUDE_PATH=%KURULUM%/include ^
            -DTG_OWT_OPENH264_INCLUDE_PATH=%KURULUM%/include || exit /b 1
          cmake --build derleme || exit /b 1
          cmake --install derleme || exit /b 1

      - name: Ne uretildi?
        shell: bash
        run: |
          echo "--- uretilen kutuphaneler ---"
          find "$GITHUB_WORKSPACE/cikti/tg_owt" -name "*.lib" -exec ls -lh {} \;

      # NVGram'i linklerken gereken .lib ve .dll dosyalari da ciktiya
      # giriyor: tg_owt onlarin sembollerine atif uretiyor ve kullanicinin
      # makinesinde ffmpeg'i yeniden derlemek saatler alirdi.
      - name: Bagimliliklari ciktiya kopyala
        shell: bash
        run: |
          KURULUM="$GITHUB_WORKSPACE/vcpkg_kurulum/x64-windows"
          mkdir -p cikti/bagimliliklar
          cp -r "$KURULUM/include" cikti/bagimliliklar/
          cp -r "$KURULUM/lib" cikti/bagimliliklar/
          cp -r "$KURULUM/bin" cikti/bagimliliklar/
          du -sh cikti/bagimliliklar/*

      # tgcalls'in KAYNAGI da ciktiya konuyor: NVGram onu kendi
      # CMake'inde derleyecek ve surumun tg_owt ile uyumlu olmasi sart.
      - name: tgcalls kaynagini ekle
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/tgcalls
          path: cikti/tgcalls-kaynak
          fetch-depth: 1

      - name: Cikti yukle
        uses: actions/upload-artifact@v4
        with:
          name: tg-owt-windows-x64
          path: cikti/
          if-no-files-found: error
